<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f5134">
  <title>Ewity Catalogue · Supply Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#17352a;background:#f2f6f4;--green:#176b45;--navy:#102d22;--muted:#697c74;--line:#dce7e1;--soft:#edf5f0}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{background:var(--navy);padding:26px 18px;color:#fff}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#d5b45c;color:#282315;font-weight:800}.brand small{display:block;color:#9fb5aa;margin-top:2px}.back{display:block;padding:12px 14px;border-radius:10px;color:#c7d7cf;text-decoration:none;font-weight:650}.back:hover{background:#ffffff14;color:#fff}.main{min-width:0}.topbar{min-height:72px;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:#ffffffdf;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}.status{padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--green);font-size:12px;font-weight:800}.content{width:min(1240px,100%);margin:auto;padding:28px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.hero h1{margin:0 0 7px;font-size:clamp(26px,4vw,40px);letter-spacing:-.045em}.hero p{margin:0;color:var(--muted)}.connect{display:flex;gap:10px;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px #17352a0b}.connect input{width:260px;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit}.connect button{min-height:44px;border:0;border-radius:9px;padding:0 17px;background:var(--green);color:#fff;font:inherit;font-weight:800;cursor:pointer}.connect button:disabled{opacity:.55}.security{font-size:12px;color:var(--muted);margin-top:8px;text-align:right}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}.metric{padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px}.metric small{color:var(--muted);font-weight:650}.metric strong{display:block;font-size:25px;margin-top:7px}.tools{display:flex;align-items:center;gap:10px;margin-bottom:18px}.search{min-height:46px;flex:1;border:1px solid var(--line);border-radius:11px;padding:0 14px;font:inherit;background:#fff}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin-bottom:14px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:#fff;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer}.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.product{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 18px #17352a08}.image{aspect-ratio:16/10;background:var(--soft);overflow:hidden}.image img{width:100%;height:100%;object-fit:cover;display:block}.image:empty{display:none}.body{padding:15px}.category{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.07em;font-weight:800}.name{font-size:15px;font-weight:800;margin:7px 0 13px;min-height:38px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.price{font-size:17px;font-weight:800}.stock{padding:5px 8px;border-radius:999px;background:#e7f6ed;color:#12633d;font-size:11px;font-weight:800}.stock.out{background:#fde9e7;color:#a7352e}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:15px}.error{padding:14px 16px;border-radius:12px;background:#fde9e7;color:#91342d;margin-bottom:18px}.hidden{display:none}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.shell{display:block}.side{padding:15px 16px}.brand{margin-bottom:10px}.topbar{padding:13px 16px}.content{padding:20px 14px}.hero{display:block}.connect{margin-top:18px;display:grid}.connect input{width:100%}.security{text-align:left}.metrics{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side"><div class="brand"><div class="mark">SM</div><div><strong>Supply Manager</strong><small>Ewity Catalogue</small></div></div><a class="back" href="./">← Back to inventory</a><a class="back" href="ewity-test.html">API connection test</a></aside>
    <main class="main">
      <header class="topbar"><strong>Villimalé Supply System</strong><span class="status" id="status">Waiting for key</span></header>
      <div class="content">
        <div class="hero"><div><h1>Ewity Catalogue</h1><p>Live categories, products, prices and availability from location 1905.</p></div><div><div class="connect"><input id="api-key" type="password" autocomplete="off" placeholder="Ewity plt_ API key"><button id="load">Load catalogue</button></div><div class="security">The key is used for this request only and is not saved.</div></div></div>
        <div id="error" class="error hidden"></div>
        <section id="catalogue" class="hidden">
          <div class="metrics"><div class="metric"><small>Categories</small><strong id="category-count">0</strong></div><div class="metric"><small>Products</small><strong id="product-count">0</strong></div><div class="metric"><small>Available now</small><strong id="available-count">0</strong></div></div>
          <div class="tools"><input id="search" class="search" placeholder="Search product name, SKU or barcode"></div>
          <div id="chips" class="chips"></div><div id="products" class="grid"></div>
        </section>
      </div>
    </main>
  </div>
  <script>
    const proxyUrl='https://tmupbruwmwlrmewhoodn.supabase.co/functions/v1/ewity-proxy';
    const endpoint='locations/1905/catalogue';
    let products=[],categories=[],activeCategory='all';
    const $=selector=>document.querySelector(selector);
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    function imageUrl(item){const image=item.thumbnail||item.image||item.images?.[0]||item.variants?.[0]?.images?.[0];if(image?.image_type==='placeholder')return '';return typeof image==='string'?image:(image?.url||'')}
    function productPrice(item){const variant=item.variants?.[0]||{};const value=item.sales_price??item.price??item.selling_price??variant.sales_price??variant.price;return value==null?'Price unavailable':'MVR '+Number(value).toFixed(2)}
    function collectProducts(catalogue){const found=[];const seen=new Set();const categoryNames=new Map((catalogue.categories||[]).map(category=>[String(category.id),category.name]));const add=(product,category)=>{if(!product||seen.has(String(product.id)))return;seen.add(String(product.id));const resolvedCategory=category||categoryNames.get(String(product.category_id))||product.category?.name||'Uncategorised';found.push({...product,_category:resolvedCategory})};(catalogue.products||[]).forEach(p=>add(p));const walk=category=>{(category.products||[]).forEach(p=>add(p,category.name));(category.children||[]).forEach(walk)};(catalogue.categories||[]).forEach(walk);return found}
    function isOut(product){return product.out_of_stock===true||product.available===false||product.is_available===false}
    function render(){const q=$('#search').value.trim().toLowerCase();const visible=products.filter(p=>(activeCategory==='all'||String(p._category)===activeCategory)&&[p.full_name,p.name,p.sku,p.barcode,p.code].some(v=>String(v??'').toLowerCase().includes(q)));$('#products').innerHTML=visible.length?visible.map(p=>{const img=imageUrl(p);const out=isOut(p);return `<article class="product"><div class="image">${img?`<img src="${escapeHtml(img)}" alt="" loading="lazy">`:''}</div><div class="body"><div class="category">${escapeHtml(p._category)}</div><div class="name">${escapeHtml(p.full_name||p.name||'Unnamed product')}</div><div class="row"><span class="price">${escapeHtml(productPrice(p))}</span><span class="stock ${out?'out':''}">${out?'Out of stock':'Available'}</span></div></div></article>`}).join(''):'<div class="empty">No products match this filter.</div>'}
    function renderChips(){const names=['all',...new Set(categories.map(c=>c.name).filter(Boolean)),...new Set(products.map(p=>p._category).filter(Boolean))];$('#chips').innerHTML=names.map(name=>`<button class="chip ${name===activeCategory?'active':''}" data-category="${escapeHtml(name)}">${name==='all'?'All products':escapeHtml(name)}</button>`).join('')}
    async function loadCatalogue(){const key=$('#api-key').value.trim();if(!key.startsWith('plt_')){showError('Enter your valid Ewity API key.');return}$('#load').disabled=true;$('#status').textContent='Loading…';$('#error').classList.add('hidden');try{const response=await fetch(proxyUrl,{method:'POST',headers:{'Content-Type':'application/json','x-ewity-key':key},body:JSON.stringify({endpoint,method:'GET'})});const payload=await response.json();if(!payload.ok)throw new Error(payload.data?.message||payload.error||`Ewity returned ${payload.status||response.status}`);const catalogue=payload.data?.data||payload.data||{};categories=catalogue.categories||[];products=collectProducts(catalogue);$('#category-count').textContent=categories.length;$('#product-count').textContent=products.length;$('#available-count').textContent=products.filter(p=>!isOut(p)).length;renderChips();render();$('#catalogue').classList.remove('hidden');$('#status').textContent='Connected · '+products.length+' products'}catch(error){showError(error.message);$('#status').textContent='Load failed'}finally{$('#load').disabled=false}}
    function showError(message){$('#error').textContent=message;$('#error').classList.remove('hidden')}
    $('#load').addEventListener('click',loadCatalogue);$('#api-key').addEventListener('keydown',event=>{if(event.key==='Enter')loadCatalogue()});$('#search').addEventListener('input',render);$('#chips').addEventListener('click',event=>{const chip=event.target.closest('[data-category]');if(!chip)return;activeCategory=chip.dataset.category;renderChips();render()});
  </script>
</body>
</html>
